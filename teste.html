<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Nossa Constelação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,300..500&family=Nunito:wght@400;600;700&family=Caveat:wght@500;600&display=swap">
<style>
:root {
  --night: #080b1f;
  --dusk: #2b1a4a;
  --glow: #ff7a8f;
  --gold: #ffd98e;
  --cream: #fff4e0;
  --mist: #b8b3d8;
  --ink: #1b0f2b;
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-hand: "Caveat", "Segoe Script", "Bradley Hand", cursive;
  color-scheme: dark;
}

[hidden] { display: none !important; }
html { height: 100%; box-sizing: border-box; }
body {
  height: 100%;
  margin: 0;
  background: var(--night);
  color: var(--cream);
  font-family: var(--font-body);
  font-size: 1rem;
  line-height: 1.5;
  overflow: hidden;
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}

#sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }

.stage {
  position: relative;
  z-index: 1;
  height: 100%;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
  overflow-y: auto;
  scrollbar-width: none;
  padding-block: 56px 72px;
}
.stage::-webkit-scrollbar { display: none; }

.scene {
  margin: auto;
  width: 100%;
  max-width: 34rem;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 1.4rem;
}
.stage.low .scene { margin: auto auto clamp(8px, 4vh, 40px); }
.leaving { opacity: 0; transition: opacity .6s ease; pointer-events: none; }

/* Intro */
.heartIcon { filter: drop-shadow(0 0 16px rgba(255, 122, 143, .8)); animation: beat 1.8s ease-in-out infinite; }
.title {
  margin: 0;
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 300;
  font-size: clamp(2.1rem, 8.4vw, 3.4rem);
  line-height: 1.1;
  letter-spacing: -.015em;
  text-wrap: balance;
  text-shadow: 0 0 40px rgba(255, 122, 143, .35);
}
.sub { margin: 0; color: var(--mist); font-size: .98rem; max-width: 26ch; text-wrap: balance; }

/* Frases */
.lineBox {
  width: 100%;
  min-height: 3.66em;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 300;
  font-size: clamp(1.7rem, 6.6vw, 2.7rem);
  line-height: 1.22;
  letter-spacing: -.01em;
}
.line { margin: 0; text-wrap: balance; text-shadow: 0 0 18px rgba(8, 11, 31, .9), 0 0 4px rgba(8, 11, 31, .6); }
.w { display: inline-block; animation: wordIn 1s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--i) * .1s); }

/* Pergunta */
.question {
  margin: 0;
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 400;
  font-size: clamp(2.1rem, 8.6vw, 3.4rem);
  line-height: 1.1;
  letter-spacing: -.015em;
  text-wrap: balance;
  text-shadow: 0 0 36px rgba(255, 122, 143, .6), 0 0 6px rgba(8, 11, 31, .7);
}
.actions { display: flex; flex-direction: column; align-items: center; gap: 1rem; opacity: 0; }
.actions.in { animation: rise 1s cubic-bezier(.2, .7, .2, 1) 1.1s forwards; }

/* Botões */
.btn {
  font: 700 1.05rem/1 var(--font-body);
  min-height: 52px;
  padding: 0 1.8rem;
  border-radius: 999px;
  border: 1px solid transparent;
  cursor: pointer;
  letter-spacing: .02em;
  transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
}
.btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.btn.primary { background: var(--glow); color: var(--ink); box-shadow: 0 10px 40px -8px rgba(255, 122, 143, .75); }
.btn.primary:hover { transform: translateY(-2px); }
.btn.primary:active { transform: scale(.97); }
.btn.big { min-height: 64px; padding: 0 3.2rem; font-size: 1.3rem; }
.btn.ghost { background: transparent; color: var(--cream); border-color: rgba(255, 244, 224, .35); font-weight: 600; }
.btn.ghost:hover { border-color: rgba(255, 244, 224, .75); }
.btn.pulse { animation: beat 1.8s ease-in-out infinite; }
.btn:disabled { opacity: .6; cursor: default; }

/* Respirar */
.orb {
  width: 9rem;
  max-width: 60vw;
  aspect-ratio: 1;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 244, 224, .95) 0%, rgba(255, 150, 165, .75) 38%, rgba(255, 122, 143, 0) 72%);
  box-shadow: 0 0 60px rgba(255, 122, 143, .45);
  transform: scale(.55);
  animation: orb 8s ease-in-out 1;
}
.breatheTxt {
  margin: 0;
  min-height: 2.4em;
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 300;
  font-size: clamp(1.5rem, 5.6vw, 2.1rem);
}

/* Resposta */
.eyebrow { margin: 0; font-size: .72rem; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); }
.yesTitle {
  margin: 0;
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 400;
  font-size: clamp(2.4rem, 10vw, 4rem);
  line-height: 1.05;
  text-wrap: balance;
  text-shadow: 0 0 40px rgba(255, 122, 143, .6), 0 0 6px rgba(8, 11, 31, .7);
}
.yesText { margin: 0; font-size: 1.15rem; max-width: 24ch; text-wrap: balance; text-shadow: 0 0 12px rgba(8, 11, 31, .8); }
.seal { position: relative; width: 9.5rem; max-width: 100%; aspect-ratio: 1; display: grid; place-items: center; }
.ring { position: absolute; inset: 0; animation: spin 48s linear infinite; }
.ring span {
  position: absolute;
  left: 50%;
  top: 0;
  height: 50%;
  transform-origin: 0 100%;
  transform: rotate(calc(var(--i) * 9deg));
  font-size: .62rem;
  line-height: 1;
  color: var(--gold);
}
.sealCore {
  width: 62%;
  aspect-ratio: 1;
  border-radius: 50%;
  border: 1px solid rgba(255, 217, 142, .5);
  background: rgba(255, 122, 143, .14);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.sealCore .small { font-size: .6rem; letter-spacing: .22em; text-transform: uppercase; color: var(--mist); line-height: 1; }
.sealCore .num { font-family: var(--font-display); font-style: italic; font-weight: 400; font-size: 3rem; line-height: 1; }
.when { margin: 0; font-size: .85rem; letter-spacing: .06em; color: var(--mist); font-variant-numeric: tabular-nums; }
.final {
  margin: 0;
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 300;
  font-size: clamp(1.35rem, 5vw, 1.8rem);
  line-height: 1.25;
  max-width: 20ch;
  text-wrap: balance;
  text-shadow: 0 0 12px rgba(8, 11, 31, .8);
}
.sign { margin: 0; font-family: var(--font-hand); font-weight: 600; font-size: 1.9rem; color: var(--gold); line-height: 1; }
.rise { animation: rise 1s cubic-bezier(.2, .7, .2, 1) both; animation-delay: var(--d, 0s); }
#yes { gap: 1.1rem; }

/* Rodapé e som */
.foot {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: .7rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
  pointer-events: none;
}
.dots { display: flex; gap: .6rem; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255, 244, 224, .25); transition: background .6s, box-shadow .6s, transform .6s; }
.dot.done { background: rgba(255, 217, 142, .6); }
.dot.on { background: var(--gold); box-shadow: 0 0 10px rgba(255, 217, 142, .9); transform: scale(1.35); }
.hint { margin: 0; font-size: .7rem; letter-spacing: .16em; text-transform: uppercase; color: var(--mist); opacity: 0; transition: opacity 1s ease; }
.hint.show { opacity: .85; }

.sound {
  position: fixed;
  z-index: 3;
  top: calc(env(safe-area-inset-top, 0px) + 14px);
  right: calc(env(safe-area-inset-right, 0px) + 14px);
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 1px solid rgba(255, 244, 224, .3);
  background: rgba(11, 16, 40, .5);
  color: var(--cream);
  display: grid;
  place-items: center;
  cursor: pointer;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.sound:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.sound .slash { display: none; }
.sound.off .slash { display: inline; }
.sound.off .waves { display: none; }

@keyframes wordIn { from { opacity: 0; transform: translateY(.45em); filter: blur(7px); } to { opacity: 1; transform: none; filter: blur(0); } }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes beat { 0%, 100% { transform: scale(1); } 14% { transform: scale(1.07); } 28% { transform: scale(1); } 42% { transform: scale(1.045); } 56% { transform: scale(1); } }
@keyframes orb { 0%, 100% { transform: scale(.55); } 50% { transform: scale(1); } }
@keyframes spin { to { transform: rotate(360deg); } }

@media (prefers-reduced-motion: reduce) {
  .w, .rise, .heartIcon, .btn.pulse, .ring { animation: none; }
  .actions, .actions.in { animation: none; opacity: 1; }
  .orb { animation: none; transform: scale(.8); }
  .btn, .leaving { transition: none; }
}
</style>

</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>

<main class="stage" id="stage">
  <section class="scene" id="intro">
    <svg class="heartIcon" viewBox="0 0 24 24" width="64" height="64" aria-hidden="true">
      <defs><linearGradient id="hg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffa3a8"/><stop offset="1" stop-color="#ff6f8c"/></linearGradient></defs>
      <path fill="url(#hg)" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
    </svg>
    <h1 class="title">Tenho uma coisa<br>para te mostrar.</h1>
    <p class="sub">Demora um minutinho. Se puderes, põe o som.</p>
    <button id="openBtn" class="btn primary" type="button">Abrir</button>
  </section>

  <section class="scene" id="story" hidden>
    <div class="lineBox"><p class="line" id="line" aria-live="polite"></p></div>
  </section>

  <section class="scene" id="ask" hidden>
    <h2 class="question" id="question"></h2>
    <div class="actions" id="actions">
      <button id="yesBtn" class="btn primary big pulse" type="button">Quero</button>
      <button id="breatheBtn" class="btn ghost" type="button">Deixa-me respirar</button>
    </div>
  </section>

  <section class="scene" id="breathe" hidden>
    <div class="orb" id="orb"></div>
    <p class="breatheTxt" id="breatheTxt" aria-live="polite"></p>
  </section>

  <section class="scene" id="yes" hidden>
    <p class="eyebrow rise" style="--d:.1s">Pedido aceite</p>
    <h2 class="yesTitle rise" style="--d:.5s">Disseste que sim.</h2>
    <p class="yesText rise" style="--d:1.7s">A partir de hoje, és oficialmente a minha miuda🫶.</p>
    <div class="seal rise" style="--d:2.8s">
      <div class="ring" id="ring" aria-hidden="true"></div>
      <div class="sealCore"><span class="small">Dia</span><span class="num">1</span></div>
    </div>
    <p class="when rise" id="when" style="--d:3.2s"></p>
    <p class="final rise" style="--d:4.6s">Não vim a tempo de ser o teu primeiro amor, mas espero ser o ultimo.</p>
    <p class="sign rise" id="sign" style="--d:5.6s" hidden></p>
  </section>
</main>

<footer class="foot" id="foot" hidden>
  <div class="dots" id="dots" aria-hidden="true"></div>
  <p class="hint" id="hint">Toca para avançar</p>
</footer>

<button class="sound" id="sound" type="button" aria-label="Desligar o som" hidden>
  <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/>
    <path class="waves" d="M15.5 9a4 4 0 010 6M18 6.5a7.5 7.5 0 010 11"/>
    <path class="slash" d="M16 9.5l5 5M21 9.5l-5 5"/>
  </svg>
</button>

<script>
(function () {
  'use strict';
  document.documentElement.lang = 'pt-PT';

  /* ===== PERSONALIZA AQUI ===== */
  var CFG = { nome: 'Lunita', assinatura: 'Sérgio' };
  
  // Coloca aqui o link do Formspree (ex: "https://formspree.io/f/xbjwpwkq")
  var formspreeEndpoint = "https://formspree.io/f/mqpejykv"; 
  /* ============================ */

  var voc = CFG.nome ? ', ' + CFG.nome : '';
  var PERGUNTA = CFG.nome ? CFG.nome + ', queres namorar comigo?' : 'Queres namorar comigo?';

  var SCENES = [
    { mood: 'sky', lines: [
      { t: 'Olá' + voc + '.' },
      { t: 'Fiz isto para ti, com muito cuidado.' },
      { t: 'Fica comigo um minutinho.' }
    ] },
    { mood: 'petals', lines: [
      { t: 'Lembras-te do dia em que nos conhecemos?' },
      { t: 'Eu lembro-me de tudo. Até do que nem sabia que me estava a aguardar.' },
      { t: 'Do teu riso. Da tua personalidade. Da tua presença.' },
      { t: 'Desde então, os meus dias têm outra cor.' }
    ] },
    { mood: 'stars', low: true, lines: [
      { t: 'Procurei no céu inteiro uma estrela que se parecesse contigo.' },
      { t: 'Nenhuma chegava. Por isso juntei as minhas.', run: 'draw', hold: 6600 },
      { t: 'E saiu isto.' },
      { t: 'Cada ponto é uma coisa que gosto em ti.' },
      { t: 'E ainda me sobrou uma luz para fazer uma pergunta.' }
    ] },
    { mood: 'ask', low: true, lines: [
      { t: 'Ensaiei isto muitas vezes. Nunca sai igual.' },
      { t: 'Então digo da maneira mais simples.' }
    ] }
  ];

  var $ = function (id) { return document.getElementById(id); };
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  var RM = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  /* ---------- Música ---------- */
  var Music = (function () {
    var ac = null, out = null, bus = null, timer = null, nextT = 0, slot = 0, muted = false, energy = 0, started = false;
    var BPM = 64, EIGHTH = 60 / BPM / 2;
    var CHORDS = [[60, 64, 67, 71], [57, 60, 64, 67], [53, 57, 60, 64], [55, 59, 62, 64]];
    var BASS = [48, 45, 41, 43];
    var MELODY = [[76, 0, 79, 0, 83, 0, 79, 0], [81, 0, 79, 0, 76, 0, 72, 0], [77, 0, 81, 0, 84, 0, 81, 0], [79, 0, 83, 0, 86, 0, 83, 0]];
    var ARP = [0, 1, 2, 3, 2, 1, 2, 1];
    var PENT = [67, 69, 72, 74, 76, 79, 81, 84, 86, 88, 91, 93];
    var mtof = function (m) { return 440 * Math.pow(2, (m - 69) / 12); };

    function impulse(secs, decay) {
      var len = Math.floor(ac.sampleRate * secs);
      var b = ac.createBuffer(2, len, ac.sampleRate);
      for (var c = 0; c < 2; c++) {
        var d = b.getChannelData(c);
        for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
      }
      return b;
    }
    function tone(freq, t, dur, vel, type) {
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vel, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(bus);
      o.start(t); o.stop(t + dur + 0.05);
    }
    function bell(m, t, vel, dur) {
      var f = mtof(m);
      tone(f, t, dur, vel, 'sine');
      tone(f * 2, t, dur * 0.5, vel * 0.35, 'sine');
      tone(f * 4.02, t, dur * 0.18, vel * 0.12, 'sine');
    }
    function pad(notes, t, dur, vel) {
      notes.forEach(function (m, i) {
        var o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
        o.type = 'triangle'; o.frequency.value = mtof(m); o.detune.value = (i % 2 ? 6 : -6);
        f.type = 'lowpass'; f.frequency.value = 900;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vel, t + dur * 0.35);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(f); f.connect(g); g.connect(bus);
        o.start(t); o.stop(t + dur + 0.1);
      });
    }
    function schedule() {
      if (!ac) return;
      while (nextT < ac.currentTime + 0.9) {
        var bar = Math.floor(slot / 8) % 4, s = slot % 8;
        var tt = nextT + Math.random() * 0.01;
        if (s === 0) {
          pad(CHORDS[bar].map(function (m) { return m - 12; }), tt, EIGHTH * 8 * 1.25, 0.04 + 0.025 * energy);
          tone(mtof(BASS[bar]), tt, 2.6, 0.12, 'sine');
        }
        bell(CHORDS[bar][ARP[s]], tt, 0.055 * (0.85 + Math.random() * 0.3) * (1 + 0.5 * energy), 1.6);
        var mel = MELODY[bar][s];
        if (mel) {
          bell(mel, tt, 0.11 * (0.9 + Math.random() * 0.2) * (1 + 0.35 * energy), 2.6);
          if (energy > 0.5) bell(mel + 12, tt + 0.01, 0.04, 2);
        }
        nextT += EIGHTH; slot++;
      }
    }
    function start() {
      if (started) return; started = true;
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        ac = new AC();
        out = ac.createGain(); out.gain.value = 0.0001;
        var comp = ac.createDynamicsCompressor(); out.connect(comp); comp.connect(ac.destination);
        bus = ac.createGain(); bus.gain.value = 1;
        var dry = ac.createGain(); dry.gain.value = 0.75; bus.connect(dry); dry.connect(out);
        var conv = ac.createConvolver(); conv.buffer = impulse(3.2, 2.4);
        var wet = ac.createGain(); wet.gain.value = 0.6; bus.connect(conv); conv.connect(wet); wet.connect(out);
        if (ac.state === 'suspended') { var p = ac.resume(); if (p && p.catch) p.catch(function () {}); }
        nextT = ac.currentTime + 0.15; slot = 0; schedule();
        timer = setInterval(schedule, 250);
        out.gain.setTargetAtTime(muted ? 0.0001 : 0.95, ac.currentTime, 0.8);
      } catch (e) { ac = null; }
    }
    function setMuted(v) {
      muted = v;
      if (!ac) return;
      if (!v && ac.state === 'suspended') { var p = ac.resume(); if (p && p.catch) p.catch(function () {}); }
      out.gain.setTargetAtTime(v ? 0.0001 : 0.95, ac.currentTime, 0.15);
    }
    function chime(i) {
      if (!ac || muted) return;
      var j = i < PENT.length ? i : Math.max(0, 2 * PENT.length - 2 - i);
      bell(PENT[j], ac.currentTime + 0.02, 0.1, 2.4);
    }
    function sparkle() {
      if (!ac || muted) return;
      var t = ac.currentTime + 0.01, n = 2 + Math.floor(Math.random() * 2);
      for (var i = 0; i < n; i++) bell(PENT[5 + Math.floor(Math.random() * 7)], t + i * 0.09, 0.05, 1.8);
    }
    function celebrate() {
      if (!ac) return;
      var t = ac.currentTime + 0.05; energy = 1;
      pad([48, 55, 60, 64, 67, 74], t, 6, 0.08);
      [72, 76, 79, 84, 88, 91, 96].forEach(function (m, i) { bell(m, t + 0.15 + i * 0.085, 0.12, 2.8); });
    }
    document.addEventListener('visibilitychange', function () {
      if (!ac) return;
      if (document.hidden) { var s = ac.suspend(); if (s && s.catch) s.catch(function () {}); }
      else if (!muted) { var r = ac.resume(); if (r && r.catch) r.catch(function () {}); }
    });
    return { start: start, setMuted: setMuted, isMuted: function () { return muted; }, chime: chime, sparkle: sparkle, celebrate: celebrate };
  })();

  /* ---------- Céu (canvas) ---------- */
  var Sky = (function () {
    var cv = $('sky'), ctx = cv.getContext('2d');
    var W = 1, H = 1, DPR = 1, bg = null, stars = [], last = 0, t = 0, mood = 'intro', resizing = false;
    var PAL = { rose: '255,122,143', gold: '255,217,142', cream: '255,244,224', peach: '255,176,138' };
    var MOODS = {

    breatheScene.hidden = false;
    orb.style.animation = 'none'; void orb.offsetWidth; orb.style.animation = '';
    breatheTxt.textContent = 'Inspira…'; await sleep(4000);
    breatheTxt.textContent = 'Expira…'; await sleep(4000);
    breatheTxt.textContent = 'Sem pressa. Eu fico aqui.'; await sleep(2800);

  stage.addEventListener('pointerdown', function (e) {
    if (e.target.closest && e.target.closest('button')) return;
    if (skipFn) skipFn();
    else if (inYes) Sky.burst(e.clientX, e.clientY, Math.random() < .4);
  });
  document.addEventListener('keydown', function (e) {
    if ((e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight') && skipFn && !(e.target instanceof HTMLButtonElement)) { e.preventDefault(); skipFn(); }
  });
  soundBtn.addEventListener('click', function () {
    var m = !Music.isMuted();
    Music.setMuted(m);
    soundBtn.classList.toggle('off', m);
    soundBtn.setAttribute('aria-label', m ? 'Ligar o som' : 'Desligar o som');
  });
})();
